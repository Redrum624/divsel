[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "divsel"
dynamic = ["version"]
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
description = "GIST max-min diversification with submodular utility (NeurIPS 2025) — native Rust core, numpy bindings (zero-copy for euclidean input)"
classifiers = ["Programming Language :: Rust"]
dependencies = ["numpy>=1.26"]

# Without these the PyPI project page has no Homepage/Source link at all. The
# README is the long description and PyPI does not rewrite relative links, so the
# links inside it are absolute for the same reason.
[project.urls]
Homepage = "https://github.com/Redrum624/divsel"
Source = "https://github.com/Redrum624/divsel"
Changelog = "https://github.com/Redrum624/divsel/blob/main/CHANGELOG.md"
Issues = "https://github.com/Redrum624/divsel/issues"

[project.optional-dependencies]
langchain  = ["langchain-core>=1.0"]
llamaindex = ["llama-index-core>=0.12"]

[tool.maturin]
manifest-path = "crates/divsel-py/Cargo.toml"
# Only maturin builds link as a Python extension; `cargo test` on the workspace
# keeps linking the interpreter normally.
features = ["pyo3/extension-module"]
module-name = "divsel._divsel"
python-source = "python"
# maturin 1.14.1 writes `License-File: LICENSE` into the sdist's PKG-INFO but does
# not add the file itself (the wheel does get dist-info/licenses/LICENSE); include
# it explicitly so the sdist metadata is not dangling.
#
# The sdist also ships the workspace crates' `tests/`, and `testpaths` below names
# `python/tests`, so the two things those tests read have to travel with them: the
# golden fixture (crates/divsel/tests/golden.rs and python/tests/test_golden.py
# both resolve it) and the Python test suite itself. Without them `cargo test` /
# `pytest` from an unpacked sdist fail on missing files rather than running.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "test-assets/golden-selection.json", format = "sdist" },
    { path = "python/tests/**/*.py", format = "sdist" },
]

[tool.maturin.generate-ci.github]
trusted-publishing = true
publishing-environment = "release"   # must match the PyPI trusted-publisher environment
pytest = true

[tool.maturin.generate-ci.github.linux]
targets = ["x86_64", "aarch64"]

[tool.maturin.generate-ci.github.windows]
targets = ["x64", "aarch64"]

[tool.maturin.generate-ci.github.macos]
targets = ["x86_64", "aarch64"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
