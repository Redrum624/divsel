# Hand-written CI: Rust checks, the Python test matrix, and the aarch64 SIMD-parity
# job. Wheel building + publishing is the generated .github/workflows/release.yml
# (maturin generate-ci); installability measurement is install-matrix.yml.
name: checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust (fmt, clippy, test, MSRV check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace
        env:
          # See the `golden` job: a missing fixture must fail this run, not skip.
          DIVSEL_REQUIRE_GOLDEN: "1"
      # docs/RELEASE.md lists this among the pre-tag gates, so it runs here too:
      # a broken intra-doc link or a bare URL regresses silently otherwise.
      - name: cargo doc (warnings are errors)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      # `include`/`readme` aside, cargo cannot package a file outside the package
      # root, so crates/divsel/LICENSE is a copy of the repo-root one. This is
      # what keeps the two from drifting.
      - name: the crate ships the same LICENSE text
        run: cmp LICENSE crates/divsel/LICENSE
      # MSRV gate: the published crate declares rust-version 1.83, and the
      # user-facing "needs a Rust toolchain, 1.83+" claim is about `pip install .`
      # -- which builds divsel-py, not divsel. Both are checked. Check only:
      # criterion (dev-dependency, benches) needs 1.86, so `cargo test` cannot run
      # on 1.83. divsel-py's pyo3 build script needs an interpreter, hence
      # setup-python.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.83
      - name: cargo check on MSRV 1.83
        run: cargo +1.83 check -p divsel -p divsel-py --locked

  # The Rust half of the cross-language conformance contract
  # (docs/CONFORMANCE.md), on all three platforms. The `rust` job above already
  # runs it inside `cargo test --workspace`, but only on Linux: an f32 or libm
  # difference that moved a golden value on Windows or macOS alone would ship
  # green without this. The Python reader is matrixed by the `python` job.
  golden:
    name: golden conformance (rust reader) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test -p divsel --test golden
        run: cargo test -p divsel --test golden
        env:
          # The reader skips when it cannot find the fixture, which is right for
          # a published `.crate` and wrong for a gate: a fixture missing HERE
          # must be red, not `1 passed` over zero cases. This turns the skip off.
          DIVSEL_REQUIRE_GOLDEN: "1"

  # Cross-ISA half of the bit-identity promise (R-G22): the metric:: tests assert
  # the pulp SIMD distance kernels return bit-identical results to the scalar
  # reference. The `rust` job proves it on x86_64 (AVX); this job proves it on
  # aarch64 (NEON) -- same scalar reference, so the two ISAs agree bit-for-bit.
  simd-parity:
    name: simd parity (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test metric kernels on aarch64
        shell: bash
        run: |
          set -euo pipefail
          # Two ways this job could be green without proving anything, both
          # closed here. (1) `cargo test <filter>` exits 0 when the filter
          # matches nothing, so moving `mod tests` out of `metric::` would leave
          # this permanently green with zero assertions: the parity test's own
          # name has to appear in the output. (2) A pulp dispatch that degraded
          # to the 1-lane arch would compare the scalar body to itself; the test
          # now asserts `lanes > 1` on aarch64, and `--nocapture` prints the ISA
          # it selected so the log says which one ran.
          out=$(cargo test -p divsel --lib metric:: -- --nocapture 2>&1)
          echo "$out"
          grep -q 'the_dispatched_kernels_are_bit_identical_to_the_scalar_ones \.\.\. ok' <<<"$out"

  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}${{ matrix.extras && ' + adapters' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # One cell also installs the adapter extras and runs their tests.
          - os: ubuntu-latest
            python: "3.12"
            extras: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        shell: bash
        run: |
          set -e
          python -m venv .venv
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pip install maturin pytest numpy
          maturin develop --release
          pytest python/tests -q
      # Explicit golden-fixture gate: the Python half of the cross-language
      # conformance contract (docs/CONFORMANCE.md). Also part of the run above;
      # named here so a fixture regression is visible at a glance.
      - name: golden conformance (python reader)
        shell: bash
        run: |
          set -e
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pytest python/tests/test_golden.py -q
      # Generator/fixture drift gate: CHANGELOG.md claims the fixture is
      # "regenerated byte-identically by python/tools/gen_golden.py --check".
      # One cell only -- docs/CONFORMANCE.md promises byte-identical
      # *regeneration* on one machine, and cross-platform agreement on the
      # *values* through the readers above, not on the file's bytes.
      - name: golden fixture regenerates byte-identically
        if: ${{ matrix.extras }}
        shell: bash
        run: |
          set -e
          source .venv/bin/activate
          python python/tools/gen_golden.py --check
      - name: Adapter extras
        if: ${{ matrix.extras }}
        shell: bash
        run: |
          set -e
          source .venv/bin/activate
          pip install ".[langchain,llamaindex]"
          pytest python/tests/test_adapters.py -q
