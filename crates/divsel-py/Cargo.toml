[package]
name = "divsel-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "_divsel"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
divsel = { path = "../divsel" }
pyo3  = { version = "0.29", features = ["abi3-py311"] }
numpy = "0.29"     # MUST match pyo3 minor
