[package]
name = "divsel"
description = "GIST max-min diversification with submodular utility (NeurIPS 2025)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
# The Apache-2.0 text is carried inside the package as well as at the repo root:
# `include`/`readme` aside, cargo cannot reach a file outside the package root, so
# without this copy the published .crate would ship the SPDX field and no license
# text at all. `cmp LICENSE crates/divsel/LICENSE` in CI keeps the two identical
# (`license-file = "../../LICENSE"` also works, but makes cargo warn at publish
# time that only one of license/license-file is necessary).
keywords = ["submodular", "diversification", "gist", "mmr", "retrieval"]
categories = ["algorithms", "science"]

[lib]
# criterion supplies its own harness, so the libtest one must not also claim
# `cargo bench`'s command line -- otherwise `-- --quick` is rejected by it
# before criterion ever sees it.
bench = false

[features]
# The heavy benchmark tier: every `gist/facility_location` group (including
# n = 10_000, whose iterations run 84-245 s), `gist/linear/n=100000` with the
# exact diameter, and `gist/linear/n=1000000`. Opt-in because that tier is hours
# long and its setup alone -- up to 3 GiB of Gaussian points, plus an O(n^2)
# diameter scan -- takes minutes before any measurement starts. Without it,
# `cargo bench -p divsel` is the kernels plus `gist/linear/n=10000`, which is
# single-digit minutes. See the header of `benches/gist.rs` for the full table.
bench-large = []

[dependencies]
rayon = "1.12"
pulp  = "0.22"

[dev-dependencies]
criterion = "0.8"
# Golden-fixture reader (tests/golden.rs) only. Deliberately NOT runtime
# dependencies: the published library stays serde-free (R-G14).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "gist"
harness = false
# criterion's harness has a libtest-compatible test mode that runs every
# benchmark once, fixtures included -- gigabytes of them in the `bench-large`
# tier. Benchmarks are not tests here, so `test = false` keeps this target out
# of a plain `cargo test` / `cargo test --workspace`, which is what CI runs.
#
# It does NOT keep it out of `cargo test --all-targets`: that form selects every
# target regardless of the manifest's `test` and `bench` flags, and criterion
# then sees a command line without `--bench` and enters its test mode. The guard
# for that one is in `benches/gist.rs`'s own `main`.
test = false
